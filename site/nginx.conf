server {
    listen 80;
    # Also accept IPv6. Without this, anything resolving "localhost" to ::1
    # inside the container -- a healthcheck, a sidecar -- gets connection
    # refused even though the site is serving fine over IPv4.
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    # Keep redirects relative so a non-80 port or a proxy prefix survives.
    absolute_redirect off;

    # A trailing slash must never be served (#129). try_files below finds the
    # same index.html for /docs/setup/ as for /docs/setup, so nginx used to
    # answer 200 with the correct HTML -- and then the page stayed BLANK,
    # because the client router matches the generated route `/docs/:slug`
    # exactly. /docs/setup/ matched nothing, the page module was never
    # imported, its element was never defined, and the
    # `:not(:defined) { visibility: hidden }` rule meant to prevent a flash of
    # undefined elements hid the whole document for ever. 200, every asset
    # loaded, no console error, the full text in the DOM, nothing on screen.
    #
    # Redirecting is what makes that URL curl-checkable, and scripts/verify-site.sh
    # asserts it on every CI run: CI does not run the browser suite, so a
    # blank-but-200 page is otherwise invisible to it. app.ts canonicalises the
    # path too, for hosts that are not this nginx -- `python3 -m http.server`
    # actually redirects the clean form TO the slash, so every local preview of
    # a docs page was blank.
    #
    # The regex runs before the prefix locations below, and requires a character
    # between the slashes, so "/" itself is left alone. absolute_redirect is off
    # above, so the Location stays relative and survives a proxy or a non-80 port.
    location ~ ^(/.+)/$ {
        return 301 $1;
    }

    # Clean URLs. Serve the directory's index.html directly rather than
    # redirecting to the trailing-slash form — no extra round trip, and no
    # chance of nginx rewriting the host/port on the way.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # 1-year immutable caching for the client bundle (a deploy always rewrites it)
    location /_litro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 1-week caching for Shoelace icon assets (not content-hashed — don't use immutable)
    location /shoelace/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # No-cache for HTML pages
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml text/xml;
}
