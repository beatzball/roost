name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux + fzf (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux fzf
      - name: Install tmux + fzf (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux fzf
      # tests/pi-extension-harness.mjs imports adapters/pi/roost.ts directly --
      # pi loads .ts extensions through jiti, so .ts is the only thing that file
      # can be. Node strips the types unflagged from 22.18 on; on an older one
      # the harness prints a SKIP and exits 0, so without this pin the whole pi
      # mapping suite would quietly not run in CI.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: node version
        run: node --version
      - name: tmux version
        run: tmux -V
      - name: Run test suite
        run: bash tests/run.sh
      - name: Contrast validator
        run: python3 tests/test-contrast.py

  # Release bookkeeping. The logic lives in scripts/roost-release-gate, not
  # inline here, because a workflow step cannot be tested and this project does
  # not ship logic nobody has watched fail — tests/test-release-gate.sh covers
  # it. See that script's header for why this is not release-please.
  version-changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: A VERSION bump needs a matching CHANGELOG section
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          # Only a CHANGED VERSION is this job's business. A PR that leaves it
          # alone should not be blocked by a section someone else owes.
          if git show "$base:VERSION" > /tmp/base-version 2>/dev/null \
             && [ -f VERSION ] && cmp -s /tmp/base-version VERSION; then
            echo "VERSION unchanged — nothing to check."; exit 0
          fi
          [ -f VERSION ] || { echo "No VERSION file — this repo does not cut versioned releases yet."; exit 0; }
          scripts/roost-release-gate check

  # Cut the tag once VERSION lands on main with no tag behind it. Idempotent:
  # a merge that did not bump VERSION finds the tag already there and stops, so
  # this runs harmlessly on every push to main.
  #
  # `needs: [test]` because a tag is the one thing here that is awkward to take
  # back once anyone has fetched it.
  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Tag and release, if VERSION moved ahead of the tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # main predates VERSION until the release machinery lands. That is a
          # valid state, not a failure — found by running the gate's own tests
          # on a checkout without it.
          [ -f VERSION ] || { echo "No VERSION file — nothing to tag."; exit 0; }
          v="$(scripts/roost-release-gate version)"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "v$v is already tagged — nothing to do."; exit 0
          fi
          # The pull_request check enforces this too, but a direct push to main
          # never sees that check, and a release with an empty body is worse
          # than a failed job.
          scripts/roost-release-gate check
          scripts/roost-release-gate notes > /tmp/notes.md
          git tag -a "v$v" -m "v$v"
          git push origin "v$v"
          gh release create "v$v" --title "v$v" --notes-file /tmp/notes.md
          echo "Tagged and released v$v."

  # Build the exact image Coolify deploys, run it, and probe it the same way
  # verify-prod probes production. Catches "the site builds" vs "the container
  # actually serves it" -- two different claims.
  smoke-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./site
          load: true
          tags: roost-docs:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container
        run: docker run -d --rm -p 8080:80 --name roost-docs-smoke roost-docs:ci
      - name: Probe container
        env:
          # Asserts the image really baked GIT_SHA into /version.json, so the
          # production probe below can rely on that signal.
          ROOST_EXPECT_COMMIT: ${{ github.sha }}
          ROOST_PROBE_RETRIES: '15'
          ROOST_PROBE_DELAY: '2'
        run: sh scripts/verify-site.sh http://localhost:8080
      - name: Container logs
        if: always()
        run: docker logs roost-docs-smoke || true
      - name: Stop container
        if: always()
        run: docker stop roost-docs-smoke || true

  # Deploy only when a push to main actually changed the site. A change to
  # bin/roost or the tests cannot alter what roosting.dev serves, so it should
  # not spend a build. (No-op until the Coolify secret is configured.)
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, smoke-image]
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.gate.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Did this push touch the site?
        id: gate
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1 &&
             git diff --quiet HEAD~1 HEAD -- site/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "site/ unchanged — skipping deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "site/ changed — deploying."
          fi
      - name: Trigger Coolify deploy
        if: steps.gate.outputs.changed == 'true'
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "COOLIFY_WEBHOOK_URL not set — skipping deploy."
            exit 0
          fi
          curl -fSsL -X POST \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            "$COOLIFY_WEBHOOK_URL"

  # Probe the live site after a deploy. The webhook only QUEUES a build, so
  # this must wait for the new commit to actually be serving --
  # ROOST_EXPECT_COMMIT makes the probe retry until /version.json reports this
  # exact SHA. Without it the probe passes against the previous container and a
  # failed deploy looks green.
  verify-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy.outputs.changed == 'true'
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe production
        env:
          ROOST_EXPECT_COMMIT: ${{ github.sha }}
          # Coolify builds the image before swapping the container, so allow a
          # cold, uncached build: 60 x 10s = 10 minutes.
          ROOST_PROBE_RETRIES: '60'
          ROOST_PROBE_DELAY: '10'
        run: |
          if [ -z "${{ vars.PROD_BASE_URL }}" ]; then
            echo "PROD_BASE_URL not set — skipping production probe."
            exit 0
          fi
          sh scripts/verify-site.sh "${{ vars.PROD_BASE_URL }}"
