# amux — an on-demand tmux profile for wrangling AI coding agents
#
# This is NOT your normal tmux config. It is loaded by `bin/amux` onto a
# dedicated tmux server (socket name: amux), so your everyday tmux — its
# config, sessions, and muscle memory — is left completely untouched.
#
# Run agents (claude, codex, aider, ...) as windows or panes inside `amux`.
# Claude Code hooks (see `amux hooks`) stamp each PANE with its state, and the
# status bar badges it: 🛑 blocked/needs-you · ⏳ working · ✅ done · 💤 idle.

# ---------------------------------------------------------------------------
# Prefix + core defaults — mirrors the everyday tmux setup so nothing to relearn
# ---------------------------------------------------------------------------
set -g  prefix C-s          ;# GNU Screen style (override in your amux config)
unbind C-b
bind C-s send-prefix

set -g  mouse on
setw -g mode-keys vi
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on
set -g  history-limit 50000
set -sg escape-time 10
set -g  focus-events on
set -g  default-terminal "tmux-256color"

# undercurl / coloured underlines (for neovim inside an agent pane)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# NO global default for @agent_state. An unstamped pane must read EMPTY: that is
# what makes "this pane is an agent" a decidable predicate, and it keeps a plain
# shell in a split window from badging the tab. Option lookup falls back
# pane -> window -> global, so a stray value at either outer scope would be
# inherited by every unstamped pane. Deleting these lines is not enough on a
# server that is already running — re-sourcing only adds and overwrites — so
# unset them explicitly. @agent_glyph is retired entirely: glyphs are derived
# from @amux-glyph-<state> at render time, which is why a glyph or theme change
# is now live without re-stamping anything.
set -gu @agent_state
set -gu @agent_glyph

# Migrate a running server off the old window-scoped state model EVERY time
# this file is (re)sourced, not just from the `bind r` keybinding below: on a
# running server, pressing `r` executes the OLD, already-parsed binding —
# sourcing installs the new one, it does not retroactively add this run-shell
# to the command list currently executing. Tying the migration to the source
# itself means the upgrade happens no matter what triggered the reload.
# Guarded on @amux-home: at the very first boot (the first `new-session -f`
# in bin/amux) that option is not set yet, and an unguarded run-shell with an
# empty path spawns a stray `[tmux]` error window. It is fine that this is a
# no-op on that first source — bin/amux sets @amux-home immediately after.
# `q:` sh-escapes @amux-home before it lands in run-shell's command string: the
# surrounding "..." are consumed as tmux's OWN argument-grouping quotes and
# never reach sh, so without q: a space in the install path silently breaks
# the shell word into two — no error, no migration.
if-shell -F '#{@amux-home}' 'run-shell -b "#{q:@amux-home}/scripts/amux-migrate-state"'

# --- User-facing config (override in ~/.config/amux/amux.conf) ---
set -g @amux-glyph-blocked "🛑"
set -g @amux-glyph-working "⏳"
set -g @amux-glyph-done    "✅"
set -g @amux-glyph-idle    "💤"
set -g @amux-sep-left      ""
set -g @amux-sep-right     ""
set -g @amux-color-bar-bg    "#211e38"
set -g @amux-color-bar-fg    "#c8c3e0"
set -g @amux-color-logo-bg   "#7c6ff0"
set -g @amux-color-active-bg "#bd93f9"
set -g @amux-color-active-fg "#12101f"
set -g @amux-color-idle-fg   "#8a84b0"
set -g @amux-notify-backend  "auto"
# Fallback label scripts/amux-agent-state stamps onto an unnamed pane once it
# first reports a state, so the border/switcher stop reading the agent's own
# churning version string. Kept here too (the hook also has a "claude"
# fallback of its own) so a server booted without this conf still works, and
# so this option shows up for anyone reading the conf, or running `tmux
# show-options -g | grep amux`, as the option list.
set -g @amux-name-default    "claude"

# --- Tab badge: one glyph per DISTINCT agent state among the window's panes ---
# Panes are the unit of agency, so a tab summarises its panes. Urgency-ordered
# (blocked, working, done, idle) and deduplicated, so three working agents read
# as a single hourglass. Unstamped panes contribute nothing — that is what keeps
# a helper shell from smearing an idle glyph onto a busy tab — and a window with
# no agents at all falls back to the idle glyph so a fresh tab looks unchanged.
#
# Computed live from #{P:} on each status tick, so a pane dying can never leave
# a stale badge behind. Held in ONE option, referenced by both tab formats via
# #{E:}, so the two can never drift and a user can override it in one place.
#
# CAUTION: a literal comma inside #{P:...} is parsed as the active/inactive
# argument separator, NOT as text. The loop bodies below use a space separator.
set -g @amux-tab-badge "#{?#{==:#{P:#{@agent_state}},},#{@amux-glyph-idle},#{?#{m:*blocked*,#{P:#{@agent_state} }},#{@amux-glyph-blocked},}#{?#{m:*working*,#{P:#{@agent_state} }},#{@amux-glyph-working},}#{?#{m:*done*,#{P:#{@agent_state} }},#{@amux-glyph-done},}#{?#{m:*idle*,#{P:#{@agent_state} }},#{@amux-glyph-idle},}}"

# Busy = the window holds something worth looking at. Drives the tab's text
# colour so idle tabs dim and busy ones draw the eye first.
set -g @amux-tab-busy "#{||:#{m:*blocked*,#{P:#{@agent_state} }},#{||:#{m:*working*,#{P:#{@agent_state} }},#{m:*done*,#{P:#{@agent_state} }}}}"

# ---------------------------------------------------------------------------
# Status bar: obvious "agent mode" look, windows badged by agent state.
# ---------------------------------------------------------------------------
set -g status on
set -g status-position top
set -g status-interval 2
set -g status-style "bg=#{@amux-color-bar-bg},fg=#{@amux-color-bar-fg}"
set -g status-left "#[bg=#{@amux-color-logo-bg},fg=#{@amux-color-active-fg},bold] ⧉ amux #[bg=#{@amux-color-bar-bg},fg=#{@amux-color-logo-bg}]#{@amux-sep-right}"
set -g status-left-length 24
# q: sh-escapes @amux-home so a space in the install path can't split the
# #() shell word — see the migrate-state if-shell above for the full story.
set -g status-right "#(#{q:@amux-home}/scripts/amux-status)#[fg=#{@amux-color-idle-fg}]#S #[fg=#{@amux-color-bar-fg}]%H:%M "
set -g status-right-length 80

# Auto-name each window after its project (the basename of the pane's cwd), so
# an agent in ~/work/api reads "api". An explicit name (`amux new foo`, or the
# rename key) sticks — tmux turns automatic-rename off for a manually-named window.
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"
# Agent state is carried by the glyph, so the tab colours don't have to encode it.
# That frees the background to mark ONE thing — which window is active — and lets
# the text keep a single high-contrast colour instead of fighting a different fill
# per state. Idle tabs dim via `@amux-tab-busy` (no blocked, working, or done pane)
# so busy ones draw the eye first.
# The trailing "·LABEL" is suppressed when LABEL == window_name: `spawn NAME`
# sets @amux-name to the very string that is already the window name (it names
# the window AND the pane from the same NAME), so an unconditional suffix would
# render the tab as "api-agent·api-agent" — an echo of the tab's own name where
# real signal (what's actually running) used to be. LABEL itself is the usual
# name-with-command-fallback conditional; the suppression test has to embed
# that same conditional a second time (not reference it through a second
# #{E:} indirection — nested #{E:} is not reliable in this codebase, see the
# comment at @amux-pane-border) so LABEL is inlined twice below, verbose but
# explicit: once inside the #{==:} suppression test, once as the shown suffix.
setw -g window-status-format         "#[fg=#{?#{E:@amux-tab-busy},#{@amux-color-bar-fg},#{@amux-color-idle-fg}}] #{E:@amux-tab-badge} #I #{window_name}#{?#{==:#{?#{==:#{@amux-name},},#{pane_current_command},#{@amux-name}},#{window_name}},,·#{?#{==:#{@amux-name},},#{pane_current_command},#{@amux-name}}} #[default]"
# The active tab is dracula's light_purple (#bd93f9) — deliberately NOT the logo
# purple, so the two chips read as different things. Lighter, not darker: the bar
# is already dark, so a darker wedge would fade into it (#5b4fc4 manages only
# 2.6:1 against the bar, vs 6.7:1 for this).
# Both edges use the same U+E0B0 wedge, with the colours swapped, so every arrow
# on the bar points the same way and the tab reads as a chevron:
#   left  edge: fg=bar,  bg=tab  -> bar slants INTO the tab
#   right edge: fg=tab,  bg=bar  -> tab slants OUT into the bar
# Needs a powerline/Nerd Font. Without one both render as a tofu box — replace
# each wedge with a plain space, or run `amux init` to pick a fallback.
# Same LABEL-vs-window_name suppression as window-status-format above.
setw -g window-status-current-format "#[fg=#{@amux-color-bar-bg},bg=#{@amux-color-active-bg}]#{@amux-sep-left}#[bg=#{@amux-color-active-bg},fg=#{@amux-color-active-fg},bold] #{E:@amux-tab-badge} #I #{window_name}#{?#{==:#{?#{==:#{@amux-name},},#{pane_current_command},#{@amux-name}},#{window_name}},,·#{?#{==:#{@amux-name},},#{pane_current_command},#{@amux-name}}} #[fg=#{@amux-color-active-bg},bg=#{@amux-color-bar-bg}]#{@amux-sep-right}#[default]"
setw -g window-status-separator ""

# ---------------------------------------------------------------------------
# Pane borders — inside a split window, which pane is which agent?
# ---------------------------------------------------------------------------
# Always on, not only for split windows: it costs one row everywhere, and the
# alternative is a hook keeping a per-window setting in sync with the pane count.
# An agent pane reads "🛑 %12 claude · blocked 14:20"; a plain shell reads just
# "%14 zsh". Both the glyph and the trailing clause are guarded on @agent_state,
# and the timestamp additionally on @agent_since, so a half-stamped pane cannot
# render garbage. The state->glyph chain is INLINED rather than kept in its own
# option: #{E:} inside #{E:} relies on expansion depth that is not guaranteed.
# The name test is emptiness (#{==:...,}), not truthiness (#{?@amux-name,...}):
# tmux's ?-truthiness treats the string "0" as false, so a pane literally named
# "0" would otherwise fall back to #{pane_current_command} here.
set -g @amux-pane-border " #{?@agent_state,#{?#{==:#{@agent_state},blocked},#{@amux-glyph-blocked},#{?#{==:#{@agent_state},working},#{@amux-glyph-working},#{?#{==:#{@agent_state},done},#{@amux-glyph-done},#{@amux-glyph-idle}}}} ,}#{pane_id} #{?#{==:#{@amux-name},},#{pane_current_command},#{@amux-name}}#{?@agent_state, · #{@agent_state}#{?@agent_since, #{t/p:@agent_since},},} "
setw -g pane-border-status top
setw -g pane-border-format "#{E:@amux-pane-border}"
# The focused pane is marked with the same colour the active tab already uses,
# so "where am I" reads the same on the bar and in the window.
setw -g pane-border-style        "fg=#{@amux-color-idle-fg}"
setw -g pane-active-border-style "fg=#{@amux-color-active-bg}"

# ---------------------------------------------------------------------------
# Key bindings — GNU-Screen-style, mirroring a common tmux setup
# ---------------------------------------------------------------------------
# pane navigation (vim)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# pane resizing (repeatable)
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2
# swap panes
bind > swap-pane -D
bind < swap-pane -U
# splits (your scheme: - stacked, _ side-by-side), inherit cwd
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"
# new agent window / new session
bind c   new-window   -c "#{pane_current_path}"
bind C-c new-session
# reload amux config
# -F expands the path as a format; source-file does not expand #{} without it.
bind r source-file -F "#{@amux-home}/tmux/amux.conf" \; source-file -qF "#{@amux-user-conf}" \; display "amux config reloaded"

# amux-specific: jump to the next agent that needs you. State is per-pane, so
# this selects the blocked PANE, not just its window.
bind b run-shell '$AMUX_HOME/scripts/amux-next-blocked'
# fzf popup switcher across all agents (state + elapsed time)
# display-popup has no -F, so the shell expands $AMUX_HOME at run time. Single
# quotes are required: double quotes would expand it when this file is parsed,
# before bin/amux sets it.
bind a display-popup -E -w 70% -h 60% '$AMUX_HOME/scripts/amux-switch'

# amux settings TUI (change theme/glyphs/separator/notifications live)
bind S display-popup -E -w 60% -h 50% '$AMUX_HOME/scripts/amux-settings'
