# amux — an on-demand tmux profile for wrangling AI coding agents
#
# This is NOT your normal tmux config. It is loaded by `bin/amux` onto a
# dedicated tmux server (socket name: amux), so your everyday tmux — its
# config, sessions, and muscle memory — is left completely untouched.
#
# Run agents (claude, codex, aider, ...) as windows inside `amux`. Claude Code
# hooks (see `amux hooks`) stamp each window with its state, and the status bar
# badges it: 🛑 blocked/needs-you · ⏳ working · ✅ done · 💤 idle.

# ---------------------------------------------------------------------------
# Prefix + core defaults — mirrors the everyday tmux setup so nothing to relearn
# ---------------------------------------------------------------------------
set -g  prefix C-s          ;# GNU Screen style (override in your amux config)
unbind C-b
bind C-s send-prefix

set -g  mouse on
setw -g mode-keys vi
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on
set -g  history-limit 50000
set -sg escape-time 10
set -g  focus-events on
set -g  default-terminal "tmux-256color"

# undercurl / coloured underlines (for neovim inside an agent pane)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Default state for any window until a hook says otherwise.
set -g @agent_state "idle"
set -g @agent_glyph "💤"

# ---------------------------------------------------------------------------
# Status bar: obvious "agent mode" look, windows badged by agent state.
# ---------------------------------------------------------------------------
set -g status on
set -g status-position top
set -g status-interval 2
set -g status-style "bg=#211e38,fg=#c8c3e0"
set -g status-left "#[bg=#7c6ff0,fg=#12101f,bold] ⧉ amux #[bg=#211e38,fg=#7c6ff0]"
set -g status-left-length 24
set -g status-right "#(#{@amux_home}/scripts/amux-status)#[fg=#8a84b0]#S #[fg=#c8c3e0]%H:%M "
set -g status-right-length 80

# Auto-name each window after its project (the basename of the pane's cwd), so
# an agent in ~/work/api reads "api". An explicit name (`amux new foo`, or the
# rename key) sticks — tmux turns automatic-rename off for a manually-named window.
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"
# Agent state is carried by the glyph, so the tab colours don't have to encode it.
# That frees the background to mark ONE thing — which window is active — and lets
# the text keep a single high-contrast colour instead of fighting a different fill
# per state. Idle tabs dim to #8a84b0 so busy ones draw the eye first.
setw -g window-status-format         "#[fg=#{?#{==:#{@agent_state},idle},#8a84b0,#c8c3e0}] #{@agent_glyph} #I #{window_name}·#{pane_current_command} #[default]"
# The active tab is dracula's light_purple (#bd93f9) — deliberately NOT the logo
# purple, so the two chips read as different things. Lighter, not darker: the bar
# is already dark, so a darker wedge would fade into it (#5b4fc4 manages only
# 2.6:1 against the bar, vs 6.7:1 for this).
# Both edges use the same U+E0B0 wedge, with the colours swapped, so every arrow
# on the bar points the same way and the tab reads as a chevron:
#   left  edge: fg=bar,  bg=tab  -> bar slants INTO the tab
#   right edge: fg=tab,  bg=bar  -> tab slants OUT into the bar
# Needs a powerline/Nerd Font. Without one both render as a tofu box — replace
# each wedge with a plain space, or run `amux init` to pick a fallback.
setw -g window-status-current-format "#[fg=#211e38,bg=#bd93f9]#[bg=#bd93f9,fg=#12101f,bold] #{@agent_glyph} #I #{window_name}·#{pane_current_command} #[fg=#bd93f9,bg=#211e38]#[default]"
setw -g window-status-separator ""

# ---------------------------------------------------------------------------
# Key bindings — GNU-Screen-style, mirroring a common tmux setup
# ---------------------------------------------------------------------------
# pane navigation (vim)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# pane resizing (repeatable)
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2
# swap panes
bind > swap-pane -D
bind < swap-pane -U
# splits (your scheme: - stacked, _ side-by-side), inherit cwd
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"
# new agent window / new session
bind c   new-window   -c "#{pane_current_path}"
bind C-c new-session
# reload amux config
# -F expands the path as a format; source-file does not expand #{} without it.
bind r source-file -F "#{@amux_home}/tmux/amux.conf" \; display "amux config reloaded"

# amux-specific: jump to the next window that's blocked (an agent needs you)
bind b run-shell "tmux list-windows -F '##{@agent_state} ##{window_id}' | awk '/^blocked/{print \$2; exit}' | xargs -r tmux select-window -t"
# fzf popup switcher across all agents (state + elapsed time)
# display-popup has no -F, so the shell expands $AMUX_HOME at run time. Single
# quotes are required: double quotes would expand it when this file is parsed,
# before bin/amux sets it.
bind a display-popup -E -w 70% -h 60% '$AMUX_HOME/scripts/amux-switch'
